services:
  - type: web
    name: obywatel-ai-prototyp
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: DOC_AI_BASE_URL
        value: https://fabryka.ai/v1
      - key: DOC_AI_MODEL
        value: bielik-11b-v3
